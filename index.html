<!DOCTYPE html>

  <head>
    <!-- CRITICAL: Domain-based redirect for static HTML files in /public -->
    <script>
      (function() {
        const hostname = window.location.hostname;
        
        // Map branded subdomains to their corresponding static HTML files in the /public folder
        const redirects = {
          'bnagsamoro-investment-roadmap.asilvainnovations.com': '/dashboard.html',
          'bird-roadmap.asilvainnovations.com': '/roadmap.html',
          'bird-resources.asilvainnovations.com': '/resources.html',
          'bird-privacy-policy.asilvainnovations.com': '/privacy-policy.html',
          'bird-terms-of-service.asilvainnovations.com': '/terms-of-service.html',
          'bird-action-plan.asilvainnovations.com': '/action-plan.html',
          'bird-actors-value-map.asilvainnovations.com': '/actors-value-map.html',
          'bird-contact.asilvainnovations.com': '/contact.html'
        };
        
        if (redirects[hostname]) {
          // Use replace() to prevent the redirect from cluttering browser history
          // Preserves query parameters (e.g., ?utm_source=...) and hash fragments (#section)
          window.location.replace(redirects[hostname] + window.location.search + window.location.hash);
        } else {
          // FALLBACK: If no redirect occurs (e.g., user visits the React app directly via localhost or an unmapped domain), 
          // dynamically update SEO tags to match the current hostname for accurate indexing.
          const currentUrl = window.location.origin + window.location.pathname;
          
          // Update Canonical URL
          const canonical = document.querySelector('link[rel="canonical"]');
          if (canonical && canonical.href.includes('%VITE_CANONICAL_DOMAIN%')) {
            canonical.href = currentUrl;
          }
          
          // Update Open Graph URL
          const ogUrl = document.querySelector('meta[property="og:url"]');
          if (ogUrl && ogUrl.content.includes('%VITE_CANONICAL_DOMAIN%')) {
            ogUrl.content = currentUrl;
          }
        }
      })();
    </script>
