name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check
        run: npm run typecheck

      - name: Run build
        run: npm run build

      - name: Verify Edge Functions compile (if supabase CLI available)
        run: |
          if command -v supabase &> /dev/null; then
            supabase functions build ai-strategy-assistant
            supabase functions build email-notifications
            supabase functions build survey-submit
          else
            echo "Supabase CLI not available — skipping Edge Function build verification"
          fi
        continue-on-error: true

      - name: Check for hardcoded secrets in Edge Functions
        run: |
          # Fail if any hardcoded API keys are found
          if grep -rE '(sk-[a-zA-Z0-9]{20,}|api[_-]?key.*=.*["'][^"']{10,}["'])' supabase/functions/ --include="*.ts" ; then
            echo "❌ Potential hardcoded API keys found in Edge Functions!"
            exit 1
          else
            echo "✅ No hardcoded API keys detected"
          fi
        continue-on-error: false

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
