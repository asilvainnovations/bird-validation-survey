name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check (blocking)
        run: npm run typecheck

      - name: Run lint — temporary max-warnings gate (blocking)
        # NOTE: ratchet --max-warnings down to 0 once existing warnings are fixed
        run: npm run lint -- --max-warnings=60

      - name: Dependency vulnerability audit (blocking, high+ only)
        # Findings that are accepted rather than fixed must be documented in
        # SECURITY-EXCEPTIONS.md. This step still fails CI on any *new*,
        # undocumented high/critical finding.
        run: npm audit --audit-level=high

      - name: Verify EDGE_FUNCTIONS registry matches supabase/functions/ (blocking)
        run: node scripts/check-edge-functions.mjs

      - name: Generate and validate manifest.json (blocking)
        run: |
          node scripts/generate-manifest.mjs
          node -e "JSON.parse(require('fs').readFileSync('public/manifest.json','utf-8')); console.log('manifest.json is valid JSON')"
        env:
          CANONICAL_DOMAIN: ${{ vars.CANONICAL_DOMAIN }}

      - name: Run build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_CANONICAL_DOMAIN: ${{ vars.CANONICAL_DOMAIN }}

      - name: Verify Edge Functions compile (if supabase CLI available)
        run: |
          if command -v supabase &> /dev/null; then
            supabase functions build email-notifications
            supabase functions build survey-submit
            supabase functions build survey-analytics
            supabase functions build strategic-planner-sync
            supabase functions build ai-strategy-assistant
          else
            echo "Supabase CLI not available — skipping Edge Function build verification"
          fi
